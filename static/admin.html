<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Whatisms</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #e6edf3;
            min-height: 100vh;
        }
        .portal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(19, 23, 32, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid #252d3a;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .portal-header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #e6edf3;
            letter-spacing: -0.02em;
        }
        .portal-header h1 a {
            color: inherit;
            text-decoration: none;
        }
        .portal-header h1 a:hover { color: #5b8def; }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-actions span {
            color: #8b949e;
            font-size: 0.875rem;
        }
        .btn-back {
            padding: 6px 14px;
            background: transparent;
            border: 1px solid #3d4b63;
            color: #8b949e;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-back:hover {
            border-color: #5b8def;
            color: #e6edf3;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 64px 32px;
        }
        .page-title {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }
        .page-subtitle {
            color: #7d8ba0;
            font-size: 0.95rem;
            margin-bottom: 40px;
        }
        .card {
            background: #131720;
            border: 1px solid #252d3a;
            border-radius: 16px;
            padding: 28px;
        }
        .card-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #5b8def;
            margin-bottom: 20px;
        }
        .email-list { list-style: none; }
        .email-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #1c2333;
        }
        .email-item:last-child { border-bottom: none; }
        .email-text {
            font-size: 0.95rem;
            font-weight: 500;
        }
        .email-badge {
            font-size: 0.7rem;
            color: #5b8def;
            margin-left: 8px;
        }
        .btn-remove {
            padding: 4px 12px;
            background: transparent;
            border: 1px solid #3d4b63;
            color: #8b949e;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-remove:hover {
            border-color: #da3633;
            color: #f85149;
            background: rgba(218, 54, 51, 0.1);
        }
        .add-form {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #1c2333;
        }
        .add-form input {
            flex: 1;
            padding: 10px 14px;
            background: #0b0e14;
            border: 1px solid #252d3a;
            border-radius: 8px;
            color: #e6edf3;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .add-form input:focus { border-color: #5b8def; }
        .add-form input::placeholder { color: #3d4b63; }
        .btn-add {
            padding: 10px 20px;
            background: #5b8def;
            border: none;
            color: #fff;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-add:hover { background: #4a7ce0; }
        .btn-add:disabled { opacity: 0.4; cursor: default; }
        .hint {
            color: #3d4b63;
            font-size: 0.8rem;
            margin-top: 16px;
            line-height: 1.5;
        }
        .error {
            color: #f85149;
            font-size: 0.85rem;
            margin-top: 12px;
            padding: 8px 12px;
            background: rgba(218, 54, 51, 0.08);
            border-radius: 8px;
        }
        .loading {
            color: #3d4b63;
            font-size: 0.9rem;
            padding: 20px 0;
        }
        @media (max-width: 640px) {
            .container { padding: 32px 20px; }
            .page-title { font-size: 1.5rem; }
            .add-form { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="portal-header">
        <h1><a href="/">Whatisms</a></h1>
        <div class="header-actions">
            <span id="user-display"></span>
            <a href="/" class="btn-back">&larr; Portal</a>
        </div>
    </div>
    <div class="container">
        <h2 class="page-title">Admin</h2>
        <p class="page-subtitle">Manage who can access whatisms.com</p>

        <div class="card">
            <div class="card-title">Allowed Email Addresses</div>
            <div id="content">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const API = '/finance/api/admin/allowlist';
        let adminEmail = '';

        async function loadUser() {
            try {
                const resp = await fetch('/finance/api/auth/session');
                const session = await resp.json();
                if (session?.user?.email) {
                    document.getElementById('user-display').textContent = session.user.email;
                }
            } catch (e) {}
        }

        async function loadAllowlist() {
            const el = document.getElementById('content');
            try {
                const res = await fetch(API);
                if (res.status === 403) {
                    el.innerHTML = '<div class="error">Access denied. Admin only.</div>';
                    return;
                }
                const data = await res.json();
                adminEmail = data.adminEmail;
                render(data.entries);
            } catch (e) {
                el.innerHTML = '<div class="error">Failed to load allowlist.</div>';
            }
        }

        function render(entries) {
            const el = document.getElementById('content');
            const items = entries.map(e => {
                const isAdmin = e.email === adminEmail;
                return `<li class="email-item">
                    <div>
                        <span class="email-text">${esc(e.email)}</span>
                        ${isAdmin ? '<span class="email-badge">Admin</span>' : ''}
                    </div>
                    ${!isAdmin ? `<button class="btn-remove" onclick="remove('${esc(e.email)}')">Remove</button>` : ''}
                </li>`;
            }).join('');

            el.innerHTML = `
                <ul class="email-list">${items}</ul>
                <form class="add-form" onsubmit="addEmail(event)">
                    <input type="email" id="new-email" placeholder="email@gmail.com" required>
                    <button type="submit" class="btn-add">Add</button>
                </form>
                <div id="form-error"></div>
                <p class="hint">Users on this list can sign in with Google. The admin email cannot be removed.</p>
            `;
        }

        async function addEmail(evt) {
            evt.preventDefault();
            const input = document.getElementById('new-email');
            const email = input.value.trim();
            if (!email) return;

            const errEl = document.getElementById('form-error');
            errEl.innerHTML = '';

            try {
                const res = await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });
                if (!res.ok) {
                    const data = await res.json();
                    errEl.innerHTML = `<div class="error">${esc(data.error || 'Failed to add')}</div>`;
                    return;
                }
                input.value = '';
                loadAllowlist();
            } catch (e) {
                errEl.innerHTML = '<div class="error">Network error</div>';
            }
        }

        async function remove(email) {
            if (!confirm('Remove ' + email + ' from allowlist?')) return;
            try {
                await fetch(API + '?email=' + encodeURIComponent(email), { method: 'DELETE' });
                loadAllowlist();
            } catch (e) {}
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        loadUser();
        loadAllowlist();
    </script>
</body>
</html>
