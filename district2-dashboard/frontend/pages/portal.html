<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal — Whatisms</title>
    <link rel="stylesheet" href="/static/css/pages.css">
    <style>
        body {
            background: #0b0e14;
            min-height: 100vh;
        }

        .portal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: rgba(19, 23, 32, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid #252d3a;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .portal-header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #e6edf3;
            letter-spacing: -0.02em;
        }

        .portal-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 64px 32px;
        }

        .portal-greeting {
            margin-bottom: 48px;
        }

        .portal-greeting h2 {
            font-size: 2rem;
            font-weight: 300;
            color: #e6edf3;
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        .portal-greeting h2 strong {
            font-weight: 600;
        }

        .portal-greeting p {
            color: #7d8ba0;
            font-size: 0.95rem;
            margin-top: 8px;
        }

        .section-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #5b8def;
            margin-bottom: 16px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .project-tile {
            position: relative;
            background: #131720;
            border: 1px solid #252d3a;
            border-radius: 16px;
            padding: 28px;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow: hidden;
        }

        .project-tile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--tile-accent, #5b8def), transparent);
            opacity: 0;
            transition: opacity 0.25s;
        }

        .project-tile:hover {
            border-color: #3d4b63;
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .project-tile:hover::before {
            opacity: 1;
        }

        .project-tile .tile-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .project-tile h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e6edf3;
            letter-spacing: -0.01em;
        }

        .project-tile p {
            font-size: 0.875rem;
            color: #7d8ba0;
            line-height: 1.6;
        }

        .tile-arrow {
            color: #3d4b63;
            transition: all 0.25s;
            margin-left: auto;
        }

        .project-tile:hover .tile-arrow {
            color: #5b8def;
            transform: translateX(3px);
        }

        @media (max-width: 640px) {
            .portal-container {
                padding: 32px 20px;
            }

            .portal-greeting h2 {
                font-size: 1.5rem;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="portal-header">
        <h1>Whatisms</h1>
        <div class="header-actions">
            <span id="user-display"></span>
            <button id="pw-btn">Change Password</button>
            <a href="/admin" id="admin-link" class="hidden">Admin</a>
            <button class="btn-danger" id="signout-btn">Sign Out</button>
        </div>
    </div>

    <div class="portal-container">
        <div class="portal-greeting">
            <h2>Welcome back<span id="greeting-name"></span></h2>
            <p>Select a project to get started.</p>
        </div>
        <div class="section-label">Your Projects</div>
        <div class="projects-grid" id="projects-grid">
            <div class="loading"><span class="spinner"></span>Loading projects...</div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div class="modal-overlay" id="pw-modal">
        <div class="page-modal">
            <h2>Change Password</h2>
            <div class="error-msg" id="pw-error"></div>
            <div class="success-msg" id="pw-success"></div>
            <form id="pw-form">
                <div class="form-group">
                    <label for="old-pw">Current Password</label>
                    <input type="password" id="old-pw" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label for="new-pw">New Password</label>
                    <input type="password" id="new-pw" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm-pw">Confirm New Password</label>
                    <input type="password" id="confirm-pw" required autocomplete="new-password">
                </div>
                <div class="modal-actions">
                    <button type="button" id="pw-cancel-btn">Cancel</button>
                    <button type="submit" class="btn-primary">Update Password</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentUser = null;

        const projectIcons = {
            'district2': { emoji: '🗽', bg: 'rgba(91, 141, 239, 0.12)', accent: '#5b8def' },
            'finance': { emoji: '💰', bg: 'rgba(63, 185, 80, 0.12)', accent: '#3fb950' },
        };

        function getProjectIcon(path) {
            if (path.includes('district')) return projectIcons['district2'];
            if (path.includes('finance')) return projectIcons['finance'];
            return { emoji: '📁', bg: 'rgba(125, 139, 160, 0.12)', accent: '#7d8ba0' };
        }

        async function loadPortal() {
            const resp = await fetch('/auth/me');
            if (!resp.ok) { window.location.href = '/login'; return; }
            const data = await resp.json();
            currentUser = data.user;
            const projects = data.projects;

            document.getElementById('user-display').textContent = currentUser.username;
            const nameEl = document.getElementById('greeting-name');
            if (currentUser.username) {
                const name = currentUser.username.charAt(0).toUpperCase() + currentUser.username.slice(1);
                nameEl.textContent = ', ' + name;
            }
            if (currentUser.role === 'admin') {
                document.getElementById('admin-link').classList.remove('hidden');
            }

            const grid = document.getElementById('projects-grid');
            grid.innerHTML = '';
            for (const p of projects) {
                const icon = getProjectIcon(p.path);
                const tile = document.createElement('a');
                tile.href = p.path;
                tile.className = 'project-tile';
                tile.style.setProperty('--tile-accent', icon.accent);
                tile.innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:space-between;">
                        <div class="tile-icon" style="background:${icon.bg}">${icon.emoji}</div>
                        <svg class="tile-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </div>
                    <div>
                        <h3>${esc(p.name)}</h3>
                        <p>${esc(p.description || '')}</p>
                    </div>
                `;
                grid.appendChild(tile);
            }
            if (projects.length === 0) {
                grid.innerHTML = '<p style="color:#7d8ba0">No projects assigned. Contact an admin.</p>';
            }
        }

        async function signOut() {
            await fetch('/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        function openPasswordModal() {
            document.getElementById('pw-modal').classList.add('active');
            document.getElementById('pw-error').style.display = 'none';
            document.getElementById('pw-success').style.display = 'none';
            document.getElementById('pw-form').reset();
        }

        function closePasswordModal() {
            document.getElementById('pw-modal').classList.remove('active');
        }

        document.getElementById('pw-btn').addEventListener('click', openPasswordModal);
        document.getElementById('pw-cancel-btn').addEventListener('click', closePasswordModal);
        document.getElementById('signout-btn').addEventListener('click', signOut);

        document.getElementById('pw-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('pw-error');
            const sucEl = document.getElementById('pw-success');
            const pwBtn = e.target.querySelector('.btn-primary');
            errEl.style.display = 'none';
            sucEl.style.display = 'none';

            const newPw = document.getElementById('new-pw').value;
            const confirmPw = document.getElementById('confirm-pw').value;
            if (newPw !== confirmPw) {
                errEl.textContent = 'New passwords do not match';
                errEl.style.display = 'block';
                return;
            }
            pwBtn.disabled = true;
            pwBtn.textContent = 'Updating...';
            try {
                const resp = await fetch('/auth/password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        old_password: document.getElementById('old-pw').value,
                        new_password: newPw,
                    }),
                });
                if (!resp.ok) {
                    const data = await resp.json();
                    throw new Error(data.error || 'Failed');
                }
                sucEl.textContent = 'Password updated successfully';
                sucEl.style.display = 'block';
                document.getElementById('pw-form').reset();
            } catch (err) {
                errEl.textContent = err.message;
                errEl.style.display = 'block';
            } finally {
                pwBtn.disabled = false;
                pwBtn.textContent = 'Update Password';
            }
        });

        // Click outside modal to close
        document.getElementById('pw-modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closePasswordModal();
        });

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        loadPortal();
    </script>
</body>
</html>
